name: Configure email DNS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan or apply the bounded VaultFront Brevo DNS records"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

jobs:
  email-dns:
    name: ${{ inputs.mode == 'apply' && 'Apply email DNS' || 'Plan email DNS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      BREVO_DOMAIN_CODE: ${{ vars.BREVO_DOMAIN_CODE }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      DOMAIN: ${{ vars.DOMAIN || 'vaultfront.io' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure bounded email DNS
        env:
          APPLY: ${{ inputs.mode == 'apply' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$APPLY" == "1" ]]; then
            node scripts/configure-email-dns.mjs --apply
          else
            node scripts/configure-email-dns.mjs
          fi

      - name: Upload email DNS receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: email-dns-${{ github.run_id }}
          path: .cache/release-evidence/email-dns-receipt.json
          if-no-files-found: error
          retention-days: 90
